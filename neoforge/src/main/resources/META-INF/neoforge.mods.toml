modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "neko_whitelist"
version = "${version}"
displayName = "Neko Launcher Whitelist"
authors = "Furimoe"
# Server-side only, so a vanilla or differently-modded client must not be
# refused for not carrying this mod.
displayTest = "IGNORE_ALL_VERSION"
description = '''
Syncs the server whitelist from a Neko Launcher instance.
'''

[[mixins]]
config = "neko_whitelist-common.mixins.json"

[[dependencies.neko_whitelist]]
modId = "neoforge"
type = "required"
versionRange = "[26.1,)"
ordering = "NONE"
side = "SERVER"

[[dependencies.neko_whitelist]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2,27)"
ordering = "NONE"
side = "SERVER"

[[dependencies.neko_whitelist]]
modId = "architectury"
type = "required"
versionRange = "[20.0.0,)"
ordering = "AFTER"
side = "SERVER"
