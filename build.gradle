plugins {
    id "dev.architectury.loom-no-remap" version "${architectury_loom_version}" apply false
    id "architectury-plugin" version "${architectury_plugin_version}"
    id "com.gradleup.shadow" version "${shadow_version}" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven { url "https://maven.architectury.dev/" }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        // 26.x publishes no mappings file and the server jar carries real class names,
        // so there is no mappings line to declare.
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    }

    java {
        withSourcesJar()
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = rootProject.java_version as int
    }
}
