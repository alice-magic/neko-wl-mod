name: Release

# Tag a release from main: every mc/** branch is built and all jars are
# attached to one GitHub release, so a server owner downloads from a single page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        branch:
          - 'mc/1.20.1'
          - 'mc/1.20.4'
          - 'mc/1.20.6'
          - 'mc/1.21.1'
          - 'mc/1.21.4'
          - 'mc/1.21.8'
          - 'mc/1.21.11'
          - 'mc/26.1.2'
          - 'mc/26.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      # The publish script lives on main; this job builds a version branch,
      # which does not carry it.
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: main-scripts

      - name: Read build properties
        id: props
        run: |
          echo "java=$(grep -oP '(?<=^java_version=).*' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "mc=$(grep -oP '(?<=^minecraft_version=).*' gradle.properties)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ steps.props.outputs.java }}
            21

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - run: ./gradlew build --no-daemon

      - name: Collect jars
        run: |
          mkdir -p artifacts
          find . -path ./artifacts -prune -o -path ./main-scripts -prune -o \
            -name '*.jar' -path '*/build/libs/*' -print \
            | grep -vE -- '-(raw|dev|dev-shadow|sources)\.jar$' \
            | grep -vE -- '/neko-whitelist-common-' \
            | while read -r jar; do
                # Name each jar for its Minecraft version so eight of them can
                # share one release page without colliding.
                base=$(basename "$jar" .jar)
                cp "$jar" "artifacts/${base}+mc${{ steps.props.outputs.mc }}.jar"
              done
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ steps.props.outputs.mc }}
          path: artifacts/*.jar
          if-no-files-found: error

      # One Modrinth version per loader, so someone filtering by Fabric or
      # NeoForge only sees the jar that fits their server. Skipped silently
      # when the secret is absent, so a fork can still cut releases.
      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_KEY }}
          MC: ${{ steps.props.outputs.mc }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          for jar in artifacts/*.jar; do
            loader=$(basename "$jar" | cut -d- -f3)
            python3 main-scripts/.github/scripts/publish_modrinth.py --file "$jar" --loader "$loader" --mc "$MC" --tag "$TAG"
          done

  # The Bukkit plugin is a single-module build producing one jar that runs on
  # Paper, Spigot, Bukkit, Folia and CanvasMC, so it does not fit the mod matrix.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plugin/bukkit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - run: ./gradlew build --no-daemon

      - name: Collect the plugin jar
        run: |
          mkdir -p artifacts
          find build/libs -name '*.jar'             | grep -vE -- '-(raw|sources)\.jar$'             | xargs -r -I{} cp {} artifacts/
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: jars-plugin
          path: artifacts/*.jar
          if-no-files-found: error

      # The plugin lives in the same Modrinth project as the mod, distinguished by
      # its loaders. One jar covers every listed Minecraft version.
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: main-scripts

      - name: Publish the plugin to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_KEY }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # One jar covers every listed Minecraft version. Looping rather than
          # globbing into a single argument, which would swallow a second jar.
          MC='1.20.1,1.20.2,1.20.4,1.20.6,1.21,1.21.1,1.21.3,1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.11,26.1,26.1.1,26.1.2,26.2'
          for jar in artifacts/*.jar; do
            python3 main-scripts/.github/scripts/publish_modrinth.py --file "$jar" --loader plugin --tag "$TAG" --mc "$MC"
          done

  release:
    needs: [build, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true

      - run: ls -l downloaded

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: downloaded/*.jar
