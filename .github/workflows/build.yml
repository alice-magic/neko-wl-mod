name: Build

on:
  push:
    branches: ['plugin/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The plugin targets Java 17 so it runs on older servers, but Gradle wants
      # a newer JVM to run itself.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - run: ./gradlew build --no-daemon

      - name: Collect the plugin jar
        run: |
          mkdir -p artifacts
          find build/libs -name '*.jar' \
            | grep -vE -- '-(raw|sources)\.jar$' \
            | xargs -r -I{} cp {} artifacts/
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: neko-whitelist-plugin
          path: artifacts/*.jar
          if-no-files-found: error
