name: Build

on:
  push:
    branches: ['mc/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each branch targets a different Minecraft version, and gradle.properties
      # is the single place that records which Java it needs.
      - name: Read build properties
        id: props
        run: |
          echo "java=$(grep -oP '(?<=^java_version=).*' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "mc=$(grep -oP '(?<=^minecraft_version=).*' gradle.properties)" >> "$GITHUB_OUTPUT"

      # Gradle and Loom need a modern JVM to run; the branch's java_version is the
      # release the mod compiles to, which Gradle's toolchain handles separately.
      # Installing both lets a Java 17 target build under a Java 21 Gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ steps.props.outputs.java }}
            21

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon -Porg.gradle.java.installations.auto-detect=true

      - name: Collect jars
        run: |
          mkdir -p artifacts
          # The raw, dev and sources jars are build intermediates, not releases.
          find . -path ./artifacts -prune -o -name '*.jar' -path '*/build/libs/*' -print \
            | grep -vE -- '-(raw|dev|dev-shadow|sources)\.jar$' \
            | xargs -r -I{} cp {} artifacts/
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: neko-whitelist-${{ steps.props.outputs.mc }}
          path: artifacts/*.jar
          if-no-files-found: error
