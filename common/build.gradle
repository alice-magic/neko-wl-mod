architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Only for the @Environment annotations, which get remapped per platform.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modApi "dev.architectury:architectury:$rootProject.architectury_api_version"
}

// The self-check is a plain main() with asserts, not a shipped class.
// Run it with: ./gradlew :common:selfCheck
tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the assert-based checks over the Minecraft-free api layer.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.furimoe.nekowhitelist.api.SelfCheck'
    jvmArgs '-ea'
}

tasks.named('check') {
    dependsOn 'selfCheck'
}
