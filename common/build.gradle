architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Only for the @Environment annotations, which get remapped per platform.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    api "dev.architectury:architectury:$rootProject.architectury_api_version"
}

// The self-check is a plain main() with asserts, not a shipped class.
// Run it with: ./gradlew :common:selfCheck
tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the assert-based checks over the Minecraft-free api layer.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.furimoe.nekowhitelist.api.SelfCheck'
    jvmArgs '-ea'
}

tasks.named('check') {
    dependsOn 'selfCheck'
}

// src/test holds SelfCheck, a plain main() with asserts, not a JUnit suite. Newer
// Gradle fails a test task that discovers nothing, so say that is expected here.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}
